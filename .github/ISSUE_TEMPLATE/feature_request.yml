name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 issue / discussions，避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你遇到的实际场景或痛点，而不是直接给方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？有交互草图更好。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法，或现有插件/工作流能否绕过。

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 编辑器
        - 文件/工作区
        - 插件系统
        - 主题/外观
        - 导出
        - AI 能力
        - 其他
