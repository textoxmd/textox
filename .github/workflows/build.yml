name: Build

# 手动触发（Actions → Build → Run workflow）或推送 v* 标签时产出安装包：
# - macOS：Textox.app → DMG（full / lite 两版，可选 --store 出 PKG）
# - Windows：MSI + NSIS（full）
# 默认不带任何签名材料，产物未签名，仅供测试；正式分发需配置下方列出的 secrets。
#
# 两条 macOS 渠道用不同的证书，别混用：
#   direct（DMG，可直接分发）→ "Developer ID Application"，配置公证凭据后自动公证 + staple
#   store（PKG，上架 App Store）→ "Apple Distribution" + provisioning profile；App Store 不需要公证
# 推送 v* 标签时 TEXTO_REQUIRE_NOTARIZATION=1：缺凭据会直接失败，避免发出未公证的 release 包。
#
# 所需 secrets（全部可选，缺省即未签名/未公证构建）：
#   APPLE_CERTIFICATE_P12          Developer ID Application 证书导出为 .p12 后 base64
#   APPLE_CERTIFICATE_PASSWORD     .p12 密码
#   APPLE_PROVISION_PROFILE        full 版 Mac App Store provisioning profile（base64，仅 store 渠道）
#   APPLE_PROVISION_PROFILE_LITE   lite 版 Mac App Store provisioning profile（base64，仅 store 渠道）
#   TEXTO_APP_SIGNING_IDENTITY     如 "Developer ID Application: Your Name (TEAMID)"
#   TEXTO_INSTALLER_SIGNING_IDENTITY  如 "3rd Party Mac Developer Installer: Your Name (TEAMID)"（仅 store）
#   TEXTO_APPLE_TEAM_ID            可选，签名身份末尾已带 (TEAMID) 时可省略
#   TEXTO_NOTARY_APPLE_ID          Apple ID（公证）
#   TEXTO_NOTARY_PASSWORD          App 专用密码（公证）
#   TEXTO_NOTARY_API_KEY           App Store Connect API Key 的 .p8 内容（base64，可选，替代上两项）
#   TEXTO_NOTARY_API_KEY_ID        对应 Key ID
#   TEXTO_NOTARY_API_ISSUER        对应 Issuer ID（Team API Key 必填）
#
# entitlements 里的团队 ID 由 scripts/build/macos.mjs 在构建时注入
# （TEXTO_APPLE_TEAM_ID 或签名身份末尾的 "(TEAMID)"），仓库中只保留 YOUR_TEAM_ID 占位。

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'macOS 构建哪个版本'
        type: choice
        options: [both, full, lite]
        default: both
      store:
        description: 'macOS 走商店渠道（PKG，需要签名材料）'
        type: boolean
        default: false
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      mac_editions: ${{ steps.set.outputs.mac_editions }}
    steps:
      - id: set
        run: |
          # 商店渠道（PKG）一次构建 full + lite 两版，忽略 edition，避免重复构建。
          if [ "${{ inputs.store }}" = "true" ]; then
            echo 'mac_editions=["full"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${{ inputs.edition }}" in
            full) echo 'mac_editions=["full"]' >> "$GITHUB_OUTPUT" ;;
            lite) echo 'mac_editions=["lite"]' >> "$GITHUB_OUTPUT" ;;
            *)    echo 'mac_editions=["full","lite"]' >> "$GITHUB_OUTPUT" ;;
          esac

  macos:
    name: macOS (${{ matrix.edition }})
    needs: plan
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(needs.plan.outputs.mac_editions) }}
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISION_PROFILE: ${{ secrets.APPLE_PROVISION_PROFILE }}
      APPLE_PROVISION_PROFILE_LITE: ${{ secrets.APPLE_PROVISION_PROFILE_LITE }}
      TEXTO_APP_SIGNING_IDENTITY: ${{ secrets.TEXTO_APP_SIGNING_IDENTITY }}
      TEXTO_INSTALLER_SIGNING_IDENTITY: ${{ secrets.TEXTO_INSTALLER_SIGNING_IDENTITY }}
      TEXTO_APPLE_TEAM_ID: ${{ secrets.TEXTO_APPLE_TEAM_ID }}
      TEXTO_NOTARY_APPLE_ID: ${{ secrets.TEXTO_NOTARY_APPLE_ID }}
      TEXTO_NOTARY_PASSWORD: ${{ secrets.TEXTO_NOTARY_PASSWORD }}
      TEXTO_NOTARY_API_KEY: ${{ secrets.TEXTO_NOTARY_API_KEY }}
      TEXTO_NOTARY_API_KEY_ID: ${{ secrets.TEXTO_NOTARY_API_KEY_ID }}
      TEXTO_NOTARY_API_ISSUER: ${{ secrets.TEXTO_NOTARY_API_ISSUER }}
      # tag 发布必须公证；手动触发不强制，缺凭据时降级为未公证产物。
      TEXTO_REQUIRE_NOTARIZATION: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Import Apple signing identity
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$APPLE_CERTIFICATE_P12" | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Install provisioning profiles
        if: env.APPLE_PROVISION_PROFILE != '' || env.APPLE_PROVISION_PROFILE_LITE != ''
        run: |
          set -euo pipefail
          if [ -n "$APPLE_PROVISION_PROFILE" ]; then
            echo "$APPLE_PROVISION_PROFILE" | openssl base64 -d -A -out src-tauri/embedded.provisionprofile
          fi
          if [ -n "$APPLE_PROVISION_PROFILE_LITE" ]; then
            echo "$APPLE_PROVISION_PROFILE_LITE" | openssl base64 -d -A -out src-tauri/embedded.provisionprofile.lite
          fi
          ls -l src-tauri/embedded.provisionprofile* || true

      # TEXTO_NOTARY_API_KEY 里存的是 .p8 的 base64；这里落成文件并把变量改成路径，
      # 后续步骤（以及 macos.mjs）拿到的就是可用路径。用 Apple ID 方式时不需要这一步。
      - name: Prepare notarization API key
        if: env.TEXTO_NOTARY_API_KEY != ''
        run: |
          set -euo pipefail
          printf '%s' "$TEXTO_NOTARY_API_KEY" | openssl base64 -d -A -out "$RUNNER_TEMP/AuthKey.p8"
          echo "TEXTO_NOTARY_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Package
        run: |
          set -euo pipefail
          args=(--edition "${{ matrix.edition }}")
          if [ "${{ inputs.store }}" = "true" ]; then
            args+=(--store)
          fi
          bun run app:package -- "${args[@]}"

      # 发布包必须公证：再独立校验一次，避免脚本跳过时静默发出未公证的 DMG。
      - name: Verify notarization
        if: inputs.store != true && env.TEXTO_REQUIRE_NOTARIZATION == '1'
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(out/*.dmg)
          [ ${#dmgs[@]} -gt 0 ] || { echo "no DMG in out/"; exit 1; }
          for dmg in "${dmgs[@]}"; do
            echo "== $dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature -vv "$dmg"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: Textox-macOS-${{ matrix.edition }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package
        run: bun run app:package -- --edition full

      - uses: actions/upload-artifact@v7
        with:
          name: Textox-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.pkg
            artifacts/**/*.msi
            artifacts/**/*.exe
