name: Build

# 手动触发（Actions → Build → Run workflow）或推送 v* 标签时产出安装包：
# - macOS：Textox.app → DMG（full / lite 两版，可选 --store 出 PKG）
# - Windows：MSI + NSIS（full）
# 默认不带任何签名材料，产物未签名，仅供测试；正式分发需配置下方列出的 secrets。
#
# 所需 secrets（全部可选，缺省即未签名构建）：
#   APPLE_CERTIFICATE_P12          Developer ID / Apple Distribution 证书导出为 .p12 后 base64
#   APPLE_CERTIFICATE_PASSWORD     .p12 密码
#   APPLE_PROVISION_PROFILE        full 版 Mac App Store provisioning profile（base64）
#   APPLE_PROVISION_PROFILE_LITE   lite 版 Mac App Store provisioning profile（base64）
#   TEXTO_APP_SIGNING_IDENTITY     如 "Apple Distribution: Your Name (TEAMID)"
#   TEXTO_INSTALLER_SIGNING_IDENTITY  如 "3rd Party Mac Developer Installer: Your Name (TEAMID)"
#   TEXTO_APPLE_TEAM_ID            可选，签名身份末尾已带 (TEAMID) 时可省略
#
# entitlements 里的团队 ID 由 scripts/build/macos.mjs 在构建时注入
# （TEXTO_APPLE_TEAM_ID 或签名身份末尾的 "(TEAMID)"），仓库中只保留 YOUR_TEAM_ID 占位。

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'macOS 构建哪个版本'
        type: choice
        options: [both, full, lite]
        default: both
      store:
        description: 'macOS 走商店渠道（PKG，需要签名材料）'
        type: boolean
        default: false
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      mac_editions: ${{ steps.set.outputs.mac_editions }}
    steps:
      - id: set
        run: |
          # 商店渠道（PKG）一次构建 full + lite 两版，忽略 edition，避免重复构建。
          if [ "${{ inputs.store }}" = "true" ]; then
            echo 'mac_editions=["full"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${{ inputs.edition }}" in
            full) echo 'mac_editions=["full"]' >> "$GITHUB_OUTPUT" ;;
            lite) echo 'mac_editions=["lite"]' >> "$GITHUB_OUTPUT" ;;
            *)    echo 'mac_editions=["full","lite"]' >> "$GITHUB_OUTPUT" ;;
          esac

  macos:
    name: macOS (${{ matrix.edition }})
    needs: plan
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(needs.plan.outputs.mac_editions) }}
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISION_PROFILE: ${{ secrets.APPLE_PROVISION_PROFILE }}
      APPLE_PROVISION_PROFILE_LITE: ${{ secrets.APPLE_PROVISION_PROFILE_LITE }}
      TEXTO_APP_SIGNING_IDENTITY: ${{ secrets.TEXTO_APP_SIGNING_IDENTITY }}
      TEXTO_INSTALLER_SIGNING_IDENTITY: ${{ secrets.TEXTO_INSTALLER_SIGNING_IDENTITY }}
      TEXTO_APPLE_TEAM_ID: ${{ secrets.TEXTO_APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Import Apple signing identity
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$APPLE_CERTIFICATE_P12" | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Install provisioning profiles
        if: env.APPLE_PROVISION_PROFILE != '' || env.APPLE_PROVISION_PROFILE_LITE != ''
        run: |
          set -euo pipefail
          if [ -n "$APPLE_PROVISION_PROFILE" ]; then
            echo "$APPLE_PROVISION_PROFILE" | openssl base64 -d -A -out src-tauri/embedded.provisionprofile
          fi
          if [ -n "$APPLE_PROVISION_PROFILE_LITE" ]; then
            echo "$APPLE_PROVISION_PROFILE_LITE" | openssl base64 -d -A -out src-tauri/embedded.provisionprofile.lite
          fi
          ls -l src-tauri/embedded.provisionprofile* || true

      - name: Package
        run: |
          set -euo pipefail
          args=(--edition "${{ matrix.edition }}")
          if [ "${{ inputs.store }}" = "true" ]; then
            args+=(--store)
          fi
          bun run app:package -- "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: Textox-macOS-${{ matrix.edition }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package
        run: bun run app:package -- --edition full

      - uses: actions/upload-artifact@v4
        with:
          name: Textox-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.pkg
            artifacts/**/*.msi
            artifacts/**/*.exe
