name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Architecture guards
        run: |
          bun run check:skeleton
          bun run check:editor-boundary
          bun run check:version

      - name: Plugin and runtime tests
        run: bun run test:plugins

      # composition 相关用例对计时敏感，CI 上偶发抖动，允许有限重试
      - name: Editor spec tests
        run: bunx vitest run --config src/components/TextoEditor/vitest.config.ts --retry=2

  rust:
    name: Rust (check + clippy)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # tauri::generate_context! 在编译期读取 src-tauri/icons（构建产物，不入库），
      # 需要先按 edition 选中一套图标；sharp 由 bun install 提供。
      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Sync app icons
        run: node scripts/build/icons.mjs select --edition full

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
